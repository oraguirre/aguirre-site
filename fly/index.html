<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Flock</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="sky" aria-label="A flock of birds drifting across a white sky" role="img"></canvas>
<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var speedScale = reduce ? 0.4 : 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Cursor tracking
  var mouse = { x: W * 0.3, y: H * 0.5 };
  var lastMove = 0;
  var present = true;
  var IDLE_AFTER = 1800; // ms without movement before the flock drifts away
  function onMove(e) {
    mouse.x = e.clientX; mouse.y = e.clientY;
    lastMove = performance.now();
    present = true;
  }
  window.addEventListener('pointermove', onMove, { passive: true });
  var holding = false, slow = 1;
  window.addEventListener('pointerdown', function (e) { holding = true; onMove(e); }, { passive: true });
  window.addEventListener('pointerup', function (e) { holding = false; if (e.pointerType === 'touch') present = false; });
  document.documentElement.addEventListener('mouseleave', function () { present = false; });
  window.addEventListener('pointercancel', function () { holding = false; });

  // Leader point the flock chases
  var leader = { x: W * 0.3, y: H * 0.5 };
  var drift = 1; // 0 = following cursor, 1 = drifting left to right (starts drifting)
  var driftSpeed = 90;
  var driftY = H * 0.5;
  var pmx = mouse.x, pmy = mouse.y, plx = leader.x, ply = leader.y;
  var cs = 0, sf = 0, ss = 0;          // cursor speed: pattern / quick / slow averages
  var svx = 0, svy = 0;                // smoothed leader velocity
  var hx = 1, hy = 0;                  // flock heading
  var burstCool = 0, boost = 0;
  var master = 0, FORM_FLAP = 1.1;   // shared wingbeat for the V formation
  var FLAPS = 2, GLIDE_TIME = 4.5;   // in formation: flap twice, then glide
  var wasGliding = false, SOLO_DUR = 1.0;
  var fp = 0, glideT = 0, gw = 0;    // flap progress (in flaps), glide timer, glide blend 0..1

  // Birds. With the cursor: a loose, wavy stream (each bird has its own distance and sideways offset).
  // Without it: a V formation, longer on one arm, like a skein of geese.
  var COUNT = 13;
  var TRAIL = 400;      // length of the loose stream at full speed
  var V_SPACING = 50;   // gap between birds along the V
  var birds = [];
  for (var i = 0; i < COUNT; i++) {
    var armA = i >= 1 && i <= 7;
    birds.push({
      x: leader.x - 160 + Math.random() * 60,
      y: leader.y + (Math.random() - 0.5) * 80,
      vx: 0, vy: 0,
      d: i === 0 ? 0.03 : (i / (COUNT - 1)) * (0.85 + Math.random() * 0.3),  // place along the stream
      l: (Math.random() - 0.5) * 150,                                          // sideways scatter
      wp: Math.random() * 6.28,
      vRank: i === 0 ? 0 : (armA ? i : i - 7),   // position along its arm of the V
      vSide: armA ? -1 : 1,
      k: 1.1 + Math.random() * 1.4,              // how eagerly it chases its slot
      wob: Math.random() * 6.28,
      wobSpeed: 0.2 + Math.random() * 0.4,
      size: 16 + Math.random() * 12,
      depth: 0.5,
      soloAt: -1, soloP: -1, soloW: 0,   // single-flap during the glide
      phase: Math.random() * 6.28,
      flap: 1.7 + Math.random() * 0.6
    });
  }
  function smooth(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }

  // Twelve poses of one wingbeat, read from the top row of the reference plates.
  // arm: shoulder-to-wrist angle (+ up, - down) | bend: how the hand turns from the arm
  // (- tip trails down on the upstroke, + tip curls up on the downstroke) | fold: wing spread
  var KEYS = [
    [ 0.00, -0.15, 1.00], [ 0.30, -0.40, 0.92], [ 0.60, -0.50, 0.85], [ 0.85, -0.35, 0.82],
    [ 0.95, -0.10, 0.88], [ 0.80,  0.15, 1.00], [ 0.45,  0.40, 1.00], [ 0.05,  0.50, 1.00],
    [-0.30,  0.45, 1.00], [-0.50,  0.25, 1.00], [-0.35,  0.05, 1.00], [-0.15, -0.10, 1.00]
  ];
  var N = KEYS.length;
  function cr(p0, p1, p2, p3, t) { // Catmull-Rom spline
    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
  }
  var pose = [0, 0, 0];
  function getPose(phase) {
    var u = (((phase / (Math.PI * 2)) % 1) + 1) % 1 * N;
    var i = Math.floor(u), t = u - i;
    var k0 = KEYS[(i + N - 1) % N], k1 = KEYS[i % N], k2 = KEYS[(i + 1) % N], k3 = KEYS[(i + 2) % N];
    for (var c = 0; c < 3; c++) pose[c] = cr(k0[c], k1[c], k2[c], k3[c], t);
    return pose;
  }

  // Each wing is a filled shape: thick at the shoulder, tapering to a fine point at the tip.
  var SEG = 12;
  function wingEdges(side, La, Lh, arm, bend, thick) {
    var wx = side * Math.cos(arm) * La, wy = -Math.sin(arm) * La;           // wrist
    var ha = arm + bend;
    var tx = wx + side * Math.cos(ha) * Lh, ty = wy - Math.sin(ha) * Lh;   // tip
    var cx = 2 * wx - tx / 2, cy = 2 * wy - ty / 2;                        // curve passes through the wrist
    var up = [], lo = [];
    for (var i = 0; i <= SEG; i++) {
      var t = i / SEG, m = 1 - t;
      var px = 2 * m * t * cx + t * t * tx;
      var py = 2 * m * t * cy + t * t * ty;
      var dx = 2 * m * cx + 2 * t * (tx - cx), dy = 2 * m * cy + 2 * t * (ty - cy);
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      if (ny > 0) { nx = -nx; ny = -ny; }                                    // normal points up
      var w = thick * Math.pow(1 - t, 1.25) * (0.35 + 0.65 * Math.sin(Math.min(1, t * 3 + 0.5) * Math.PI * 0.5));
      up.push([px + nx * w, py + ny * w]);
      lo.push([px - nx * w, py - ny * w]);
    }
    return { up: up, lo: lo };
  }

  function drawBird(b, sc) {
    var p = getPose(b.phase);
    var g = gw * (1 - b.soloW);
    var arm = p[0] + (0.16 - p[0]) * g, bend = p[1] + (-0.06 - p[1]) * g, fold = p[2] + (1 - p[2]) * g; // glide pose: just above level
    var La = b.size * 0.55 * fold, Lh = b.size * 0.65 * fold;
    var thick = b.size * 0.13;
    var L = wingEdges(-1, La, Lh, arm, bend, thick);
    var R = wingEdges(1, La, Lh, arm, bend, thick);
    var tilt = Math.max(-0.35, Math.min(0.35, b.vy / 260)); // lean with climb/dive
    var i;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(tilt);
    ctx.scale(sc, sc);
    ctx.beginPath();
    ctx.moveTo(L.up[SEG][0], L.up[SEG][1]);
    for (i = SEG - 1; i >= 0; i--) ctx.lineTo(L.up[i][0], L.up[i][1]);   // left upper edge, tip to shoulder
    for (i = 1; i <= SEG; i++) ctx.lineTo(R.up[i][0], R.up[i][1]);       // right upper edge, shoulder to tip
    for (i = SEG - 1; i >= 0; i--) ctx.lineTo(R.lo[i][0], R.lo[i][1]);   // right lower edge back
    for (i = 1; i <= SEG; i++) ctx.lineTo(L.lo[i][0], L.lo[i][1]);       // left lower edge out
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();                                                      // small body
    ctx.ellipse(0, thick * 0.1, thick * 0.9, thick * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function endSolos() {
    wasGliding = false;
    for (var i = 0; i < birds.length; i++) { birds[i].soloAt = -1; birds[i].soloP = -1; }
  }
  // At the start of each glide, pick 3 or 4 random birds to flap once at random moments
  function scheduleSolos() {
    var idx = [], i;
    for (i = 0; i < birds.length; i++) idx.push(i);
    for (i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    var n = 3 + (Math.random() < 0.5 ? 1 : 0);
    for (i = 0; i < n; i++) {
      var b = birds[idx[i]];
      b.soloAt = 0.4 + Math.random() * (GLIDE_TIME - 0.4 - SOLO_DUR - 0.5);
      b.soloP = -1;
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05) || 0.016;
    last = now;
    var idle = !present || now - lastMove > IDLE_AFTER;
    slow += ((holding ? 0.2 : 1) - slow) * Math.min(1, dt * 6);

    // Cursor speed at three response times
    var md = Math.sqrt((mouse.x - pmx) * (mouse.x - pmx) + (mouse.y - pmy) * (mouse.y - pmy)) / dt;
    pmx = mouse.x; pmy = mouse.y;
    cs += (md - cs) * Math.min(1, dt * 4);
    sf += (md - sf) * Math.min(1, dt * 10);
    ss += (md - ss) * Math.min(1, dt * 2.2);

    // Ease between following the cursor and flying across the screen
    drift += ((idle ? 1 : 0) - drift) * Math.min(1, dt * 0.9);
    var followX = leader.x + (mouse.x - leader.x) * Math.min(1, dt * 2.2);
    var followY = leader.y + (mouse.y - leader.y) * Math.min(1, dt * 2.2);
    var driftX = leader.x + driftSpeed * speedScale * dt;
    // the path bends gently toward the middle of the screen
    var driftYn = leader.y + (H * 0.5 - leader.y) * Math.min(1, dt * 0.45) + Math.sin(now / 2600) * 10 * dt;
    leader.x = followX + (driftX - followX) * drift;
    leader.y = followY + (driftYn - followY) * drift;

    // Heading follows the direction of travel
    svx += ((leader.x - plx) / dt - svx) * Math.min(1, dt * 4);
    svy += ((leader.y - ply) / dt - svy) * Math.min(1, dt * 4);
    var vm = Math.sqrt(svx * svx + svy * svy);
    var tdx = hx, tdy = hy;
    if (vm > 25) { tdx = svx / vm; tdy = svy / vm; }
    tdx += (1 - tdx) * drift; tdy += (0 - tdy) * drift;
    hx += (tdx - hx) * Math.min(1, dt * 3); hy += (tdy - hy) * Math.min(1, dt * 3);
    var hm = Math.sqrt(hx * hx + hy * hy) || 1; hx /= hm; hy /= hm;

    // Once the whole flock has left the right edge, bring it back in from the left
    if (drift > 0.9) {
      var minX = Infinity, maxX = -Infinity;
      for (var m = 0; m < birds.length; m++) { minX = Math.min(minX, birds[m].x); maxX = Math.max(maxX, birds[m].x); }
      if (minX > W + 40) {
        var shift = maxX + 80;
        leader.x -= shift;
        for (var k = 0; k < birds.length; k++) birds[k].x -= shift;
      }
    }
    plx = leader.x; ply = leader.y;

    // Speed stretches the stream: slow = bunched near the cursor, fast = long trail
    var sp01 = smooth(80, 900, cs);

    // A sudden speed change scatters the flock (only while following the cursor)
    burstCool -= dt; boost *= Math.pow(0.4, dt);
    if (drift < 0.5 && burstCool <= 0 && (sf - ss > 600 || (ss - sf > 600 && ss > 700))) {
      for (var q = 0; q < birds.length; q++) {
        var ra = Math.random() * 6.28, rm = 160 + Math.random() * 260;
        birds[q].vx += Math.cos(ra) * rm; birds[q].vy += Math.sin(ra) * rm;
      }
      burstCool = 1.2; boost = 1;
    }

    // Formation wingbeat: FLAPS flaps, then a glide with the wings held just above level
    var inForm = drift > 0.5, gwTarget = 0;
    if (!inForm) { fp = 0; glideT = 0; endSolos(); }
    else if (fp < FLAPS) { fp = Math.min(FLAPS, fp + dt * FORM_FLAP * speedScale * slow); wasGliding = false; }
    else {
      if (!wasGliding) { wasGliding = true; scheduleSolos(); }
      gwTarget = 1; glideT += dt * slow;
      if (glideT > GLIDE_TIME) { fp = 0; glideT = 0; gwTarget = 0; wasGliding = false; }
    }
    var flapping = !inForm || fp < FLAPS;
    gw += (gwTarget - gw) * Math.min(1, dt * 3);
    master = fp * Math.PI * 2;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    var px = -hy, py = hx; // sideways axis
    var mx = 0, my = 0;
    for (var c = 0; c < birds.length; c++) { mx += birds[c].x; my += birds[c].y; }
    mx /= birds.length; my /= birds.length;
    var persp = 0.4 + 0.6 * drift; // perspective is subtle while following the cursor, stronger in the V

    for (var i = 0; i < birds.length; i++) {
      var b = birds[i];
      b.wob += b.wobSpeed * dt;

      // Pattern 1 (cursor present): loose wavy stream behind the cursor
      var back = b.d * TRAIL * (0.35 + 0.95 * sp01);
      var lat = b.l * (0.75 + 0.5 * sp01) + Math.sin(back / 60 - now / 900 + b.wp) * 26;
      var wobx = Math.cos(b.wob) * 12, woby = Math.sin(b.wob * 1.3) * 9;
      var cx = leader.x - hx * back + px * lat + wobx;
      var cy = leader.y - hy * back + py * lat + woby;

      // Pattern 2 (cursor away): V formation, apex leading, arms trailing behind
      var vb = b.vRank * V_SPACING * 1.05;
      var vl = b.vSide * b.vRank * V_SPACING * 0.36;
      var vx2 = leader.x - hx * vb + px * vl + wobx * 0.4;
      var vy2 = leader.y - hy * vb + py * vl + woby * 0.4;

      var tx = cx + (vx2 - cx) * drift, ty = cy + (vy2 - cy) * drift;

      var ax = (tx - b.x) * b.k, ay = (ty - b.y) * b.k;
      for (var j = 0; j < birds.length; j++) {
        if (j === i) continue;
        var dx = b.x - birds[j].x, dy = b.y - birds[j].y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 900 && d2 > 0.01) {
          var d = Math.sqrt(d2), push = (30 - d) * 3;
          ax += dx / d * push; ay += dy / d * push;
        }
      }
      b.vx += ax * dt; b.vy += ay * dt;
      var damp = Math.pow(0.35, dt);
      b.vx *= damp; b.vy *= damp;
      var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy), max = 800 * speedScale;
      if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; }
      b.x += b.vx * dt; b.y += b.vy * dt;

      // Flap faster when chasing or scattering, slower in the steady V
      var effort = Math.min(1, sp / 200);
      if (b.soloAt >= 0 && b.soloP < 0 && wasGliding && glideT >= b.soloAt) { b.soloP = 0; b.soloAt = -1; }
      if (b.soloP >= 0) {
        b.soloP += dt * slow / SOLO_DUR;
        if (b.soloP >= 1) { b.soloP = -1; b.phase = Math.PI * 2; }
      }
      if (b.soloP >= 0) {
        b.phase = b.soloP * Math.PI * 2;                 // one full flap on its own
      } else {
        var ownRate = b.flap * (0.7 + effort * 0.6 + boost * 0.8);
        var rate = ownRate + ((flapping ? FORM_FLAP : 0) - ownRate) * drift; // slower, common rate in formation; stops to glide
        b.phase += dt * Math.PI * 2 * rate * speedScale * slow;
        var sync = smooth(0.4, 0.9, drift) * 3;                       // pull every bird into the shared beat
        var diff = ((master - b.phase + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
        b.phase += diff * Math.min(1, dt * sync);
      }
      b.soloW = b.soloP < 0 ? 0 : Math.min(1, b.soloP / 0.12, (1 - b.soloP) / 0.12);

      // Perspective: lower and forward birds are closer (bigger), upper and rear birds are farther
      var raw = 0.5 + 0.5 * ((b.y - my) / 200) + 0.25 * ((b.x - mx) / 350);
      raw = Math.max(0, Math.min(1, raw));
      var dTarget = 0.5 + persp * (raw - 0.5);
      b.depth += (dTarget - b.depth) * Math.min(1, dt * 2);
    }
    var order = birds.slice().sort(function (p1, p2) { return p1.depth - p2.depth; });
    for (var o = 0; o < order.length; o++) drawBird(order[o], 0.55 + 0.95 * order[o].depth);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
